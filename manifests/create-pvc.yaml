# PVC JSON used by the create-pvc Tekton task (Kubernetes accepts JSON with oc apply -f).
#
# The render-and-apply step writes this structure to /work/template.json via:
#   cat <<'EOF' | sed 's/^        //' > template.json
#   ...
#   EOF
# then runs jq from PATH in the step image:
#   jq \
#     --arg pvc "<name>" --arg size "<10Gi>" --arg class "<storageClass or empty>" \
#     '
#       .metadata.name = $pvc |
#       .spec.resources.requests.storage = $size |
#       if (($class != "") and ($class != "-")) then .spec.storageClassName = $class else . end
#     ' \
#     template.json > pvc.json
#
# Finally: oc apply -f pvc.json in the current namespace (TaskRun / PipelineRun namespace).
