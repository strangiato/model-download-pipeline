apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: list-directory
spec:
  description: >
    Run ls -laF on a path under a mounted PVC for inspection or debugging.

  params:
    - name: pvc-name
      type: string
      description: Name of the PersistentVolumeClaim to mount at /mnt/model-data

    - name: SUBPATH
      type: string
      description: Path relative to the PVC mount to list (e.g. . or models/input)
      default: .

  volumes:
    - name: model-pvc
      persistentVolumeClaim:
        claimName: $(params.pvc-name)

  steps:
    - name: ls
      image: busybox:1.36
      workingDir: /mnt/model-data
      volumeMounts:
        - name: model-pvc
          mountPath: /mnt/model-data
      script: |
        #!/bin/sh
        set -eu
        ls -laF "$(params.SUBPATH)"
